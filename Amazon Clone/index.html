<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">

            <div class="nav-logo border">
                <div class="logo">Amazon</div>
            </div>

            <div class="nav-address border">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-lang border">
                <img src="./flag.png" alt="IND" width="22.6" height="23.2">
                <div><b>EN</b></div>
            </div>

            <div class="common border">
                <div id="signin">Hello, sign in</div>
                <div id="account">Account & Lists</div>
            </div>

            <div class="common border">
                <div id="signin">Returns</div>
                <div id="account">& Orders</div>
            </div>

            <div class="cart border">
                <div id="cart-img"><i class="fa-solid fa-cart-arrow-down"></i></div>
                <div id="cart">
                    <div> </div>
                    <div>Cart</div>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
